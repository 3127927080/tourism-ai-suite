<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>旅途智库 · 旅游知识问答</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(30, 41, 59, 0.7);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --brand: #38bdf8;
            --brand2: #818cf8;
            --bubble-user: linear-gradient(135deg, #38bdf8, #818cf8);
            --bubble-bot: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08) 0%, transparent 50%),
            linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        .app {
            width: 100%;
            max-width: 980px;
            height: min(820px, 92vh);
            background: var(--panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 240px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .title {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .title strong {
            font-size: 14px
        }

        .title span {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.6);
        }

        .btn {
            border: none;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .chat {
            flex: 1;
            overflow: auto;
            padding: 16px 14px 10px;
            background: rgba(15, 23, 42, 0.3);
        }

        .quick {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 14px 0;
            background: rgba(15, 23, 42, 0.3);
        }

        .quick button {
            border: 1px solid rgba(56, 189, 248, 0.28);
            background: rgba(56, 189, 248, 0.08);
            color: #bae6fd;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .2s ease;
        }

        .quick button:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.55);
        }

        .citations {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.14);
        }

        .citations-title {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .citation-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .citation-item {
            font-size: 12px;
            color: #a7f3d0;
            border: 1px solid rgba(52, 211, 153, 0.3);
            background: rgba(52, 211, 153, 0.08);
            border-radius: 999px;
            padding: 4px 10px;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .dayline {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 6px 0 14px;
        }

        .msg {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            align-items: flex-start;
        }

        .msg.user {
            justify-content: flex-end
        }

        .msg > div:not(.avatar) {
            flex: 1;
            min-width: 0;
        }

        .msg.user > div:not(.avatar) {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #94a3b8;
            flex: 0 0 auto;
        }

        .avatar.bot {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2))
        }

        .bubble {
            max-width: min(720px, 76%);
            display: inline-block;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: var(--bubble-bot);
            position: relative;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            color: #e2e8f0;
        }

        .msg.user .bubble {
            background: var(--bubble-user);
            color: #fff;
            border-color: transparent;
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
        }

        .msg.user .meta {
            color: rgba(255, 255, 255, .85)
        }

        details.progress {
            margin-top: 8px;
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.4);
        }

        details.progress summary {
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            font-size: 12px;
        }

        .progress ul {
            margin: 8px 0 0 18px;
            padding: 0
        }

        .progress li {
            margin: 4px 0;
            font-size: 12px;
            color: #94a3b8
        }

        .answer-images {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer-images img {
            display: block;
            max-width: min(100%, 600px);
            max-height: 600px;
            width: auto;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            background: rgba(15, 23, 42, 0.6);
        }

        .answer-images a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            word-break: break-all;
        }

        .typing {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: .15s
        }

        .dot:nth-child(3) {
            animation-delay: .3s
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .6
            }
            40% {
                transform: translateY(-5px);
                opacity: 1
            }
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: rgba(15, 23, 42, 0.5);
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            line-height: 1.5;
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
        }

        textarea:focus {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15)
        }

        textarea::placeholder {
            color: #64748b
        }

        .send {
            width: 88px;
            height: 44px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .send:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .hint {
            padding: 0 14px 12px;
            color: var(--muted);
            font-size: 12px;
            background: transparent;
        }

        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="17.2" cy="7" r="2.1" fill="#fff"/>
                    <path d="M3.2 17.8 L9.2 9.2 L13.1 14.9 L16.2 11 L20.8 17.8 Z" fill="#fff"/>
                    <path d="M3.2 19.2 H20.8" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
                </svg>
            </div>
            <div class="title">
                <strong>旅途智库</strong>
                <span id="subTitle">旅游知识库 · 景点 / 线路 / 酒店 / 美食 / 交通</span>
            </div>
        </div>
        <div class="top-actions">
            <span class="pill" id="apiPill">API: 未连接</span>
            <button class="btn" id="btnClear">清空对话</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
            <div class="avatar bot">🤖</div>
            <div>
                <div class="bubble">你好，我是旅途智库助手。可以问我景点、线路、酒店、美食和交通问题，我会展示检索过程并标注参考来源。</div>
                <div class="meta">提示：可以问“三亚有哪些必去景点？”或“云南 6 天怎么安排？”</div>
            </div>
        </div>
    </div>

    <div class="quick" id="quick">
        <button data-q="三亚有哪些必去景点？">三亚必去景点</button>
        <button data-q="云南 6 天怎么安排？">云南 6 天线路</button>
        <button data-q="去三亚住哪个湾区比较方便？">三亚住哪</button>
        <button data-q="成都有什么必吃的美食？">成都美食</button>
        <button data-q="张家界从机场怎么去武陵源？">张家界交通</button>
    </div>

    <div class="composer">
        <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span
            class="kbd">Enter</span> 换行
    </div>
</div>

<script>
    // ============================================================
    // 配置
    // ============================================================
    const API_BASE = 'http://127.0.0.1:8003'
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const apiPill = document.getElementById('apiPill');

    // 会话管理
    let sessionId = localStorage.getItem('tourism_kb_session_id');
    if (!sessionId) {
        sessionId = 'tour-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('tourism_kb_session_id', sessionId);
    }

    // ============================================================
    // 工具函数
    // ============================================================
    function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function formatTime(ts) {
        if (!ts) return nowTime();
        const d = new Date(Number(ts) * 1000);
        if (Number.isNaN(d.getTime())) return nowTime();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", "&#039;");
    }

    function isImageUrl(url) {
        try {
            const u = new URL(url);
            return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
        } catch (e) {
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
        }
    }

    function normalizeUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
        const seen = new Set();
        const out = [];
        for (const x of (Array.isArray(arr) ? arr : [])) {
            const v = String(x || '');
            if (!v) continue;
            if (seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    function extractUrlsLoose(text) {
        const s = String(text || '');
        const regex = /(https?:\/\/[^\s]+)/g;
        const matches = s.match(regex) || [];
        const urls = [];
        const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
        const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
        for (const m of matches) {
            let u = trimHeadPunct(trimTailPunct(m));
            if (u) urls.push(u);
        }
        return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw) {
        const s = String(raw || '');
        const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
        let m;
        let lastIdx = -1;
        let lastLen = 0;
        while ((m = re.exec(s)) !== null) {
            lastIdx = m.index;
            lastLen = m[0].length;
        }
        return {idx: lastIdx, len: lastLen};
    }

    function parseAnswerAndImages(text) {
        const raw = String(text || '');
        const {idx, len} = findLastImageMarkerIndex(raw);
        if (idx === -1) return {text: raw, images: []};
        const before = raw.slice(0, idx).trimEnd();
        const after = raw.slice(idx + len).trim();
        const urls = [];
        const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                urls.push(line);
            } else {
                const matches = extractUrlsLoose(line);
                for (const u of matches) {
                    urls.push(u);
                }
            }
        }
        const seen = new Set();
        const images = [];
        for (const u of urls) {
            const normalized = normalizeUrl(u);
            if (!isImageUrl(normalized)) continue;
            if (seen.has(normalized)) continue;
            seen.add(normalized);
            images.push(normalized);
        }
        return {text: before, images};
    }

    // ============================================================
    // 核心渲染函数（修复版）
    // ============================================================
    // 把答案末尾的【参考来源】区块拆出来，单独渲染成来源标签
    function splitCitations(raw) {
        const s = String(raw || '');
        const marker = '【参考来源】';
        const idx = s.lastIndexOf(marker);
        if (idx === -1) return {text: s, citations: []};
        const text = s.slice(0, idx).trimEnd();
        const citations = s.slice(idx + marker.length)
            .split(/\r?\n/)
            .map(line => line.trim().replace(/^[-*]\s*/, ''))
            .filter(Boolean);
        return {text, citations};
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
        if (!containerEl) {
            console.warn('renderAnswerWithImages: containerEl 为空');
            return;
        }

        // 清空容器
        containerEl.innerHTML = '';

        // 先拆参考来源，再解析图片，避免来源行被当成图片候选
        const {text: textWithoutCitations, citations} = splitCitations(answerText);
        const {text, images: imagesFromBlock} = parseAnswerAndImages(textWithoutCitations);
        const candidates = Array.isArray(candidateImageUrls)
            ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
            : [];
        const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

        const allImages = new Set([
            ...(imagesFromBlock && imagesFromBlock.length > 0 ? imagesFromBlock : []),
            ...candidates,
            ...looseImages
        ]);
        const images = Array.from(allImages);

        // 渲染文本
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = (text || '').trim() || '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);

        // 渲染图片
        if (images && images.length > 0) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'answer-images';
            for (const url of images) {
                const safeUrl = normalizeUrl(url);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = safeUrl;
                img.alt = '参考图片';
                img.referrerPolicy = 'no-referrer';
                img.addEventListener('error', () => {
                    img.style.display = 'none';
                });
                imgWrap.appendChild(img);

                const link = document.createElement('a');
                link.href = safeUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = url;
                imgWrap.appendChild(link);
            }
            containerEl.appendChild(imgWrap);
        }

        // 渲染参考来源
        if (citations.length > 0) {
            const wrap = document.createElement('div');
            wrap.className = 'citations';

            const title = document.createElement('div');
            title.className = 'citations-title';
            title.textContent = '参考来源';
            wrap.appendChild(title);

            const list = document.createElement('div');
            list.className = 'citation-list';
            for (const item of citations) {
                const chip = document.createElement('span');
                chip.className = 'citation-item';
                chip.textContent = item;
                list.appendChild(chip);
            }
            wrap.appendChild(list);
            containerEl.appendChild(wrap);
        }
    }

    // ============================================================
    // 消息渲染函数
    // ============================================================
    function addUserMsg(text) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addUserMsgWithTime(text, ts) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
        const id = 'bot-his-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        if (el) {
            const answerEl = el.querySelector('.answer');
            if (answerEl) {
                renderAnswerWithImages(answerEl, text || '', imageUrls || []);
            }
        }
        scrollToBottom();
    }

    function addBotMsgSkeleton() {
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status) {
        if (!botMsgEl) return;
        const details = botMsgEl.querySelector('details.progress');
        if (!details) return;
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const totalDone = done.length;
        const totalRun = running.length;

        const statusMap = {
            'processing': '处理中',
            'completed': '已完成',
            'failed': '失败',
            'pending': '等待中',
        };
        const displayStatus = statusMap[status] || status || 'unknown';

        if (summary) {
            summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;
        }

        if (ul) {
            const lines = [
                ...done.map(x => `✅ ${x}`),
                ...running.map(x => `⏳ ${x}`)
            ];
            ul.innerHTML = '';
            if (lines.length === 0) {
                ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
            } else {
                for (const line of lines) {
                    ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
                }
            }
        }
    }

    // ============================================================
    // API 调用
    // ============================================================
    async function apiHealth() {
        try {
            const res = await fetch(`${API_BASE}/health`);
            if (!res.ok) throw new Error('health not ok');
            apiPill.textContent = 'API: 已连接';
        } catch (e) {
            apiPill.textContent = 'API: 未连接';
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length === 0) return;
            const nodes = Array.from(chatEl.querySelectorAll('.msg'));
            for (let i = 1; i < nodes.length; i++) nodes[i].remove();
            for (const item of items) {
                if (item.role === 'user') {
                    addUserMsgWithTime(item.text || '', item.ts);
                } else {
                    addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
                }
            }
            scrollToBottom();
        } catch (_) {
        }
    }

    async function submitQuery(text) {
        const res = await fetch(`${API_BASE}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                query: text,
                session_id: sessionId
            })
        });
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || '请求失败');
        }
        return await res.json();
    }

    // ============================================================
    // 核心：发送消息（修复版）
    // ============================================================
    async function onSend() {
        const text = (inputEl.value || '').trim();
        if (!text) return;
        inputEl.value = '';
        addUserMsg(text);
        const botMsgEl = addBotMsgSkeleton();
        sendBtn.disabled = true;

        // 记录 botMsgId 用于后续查找
        const botMsgId = botMsgEl.id;

        try {
            const data = await submitQuery(text);
            const {task_id} = data;

            // 获取 answer 容器
            const bubble = botMsgEl.querySelector('.bubble');
            let answerEl = bubble.querySelector('.answer');
            if (!answerEl) {
                answerEl = document.createElement('div');
                answerEl.className = 'answer';
                bubble.insertBefore(answerEl, bubble.firstChild);
            }

            renderProgress(botMsgEl, [], [], 'pending');

            const es = new EventSource(`${API_BASE}/stream/${task_id}`);
            let rawAnswerText = '';

            es.addEventListener('progress', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    // 重新获取 botMsgEl（防止引用失效）
                    const currentBotMsg = document.getElementById(botMsgId);
                    if (currentBotMsg) {
                        renderProgress(currentBotMsg, d.done_list, d.running_list, d.status);
                        if (d && d.status === 'completed') {
                            const typing = currentBotMsg.querySelector('.typing');
                            if (typing) typing.remove();
                            sendBtn.disabled = false;
                        }
                    }
                } catch (_) {
                }
            });

            es.addEventListener('delta', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if (delta) {
                        rawAnswerText += delta;
                        // 重新获取 answerEl
                        const currentBotMsg = document.getElementById(botMsgId);
                        if (currentBotMsg) {
                            const currentAnswerEl = currentBotMsg.querySelector('.answer');
                            if (currentAnswerEl) {
                                renderAnswerWithImages(currentAnswerEl, rawAnswerText, []);
                            }
                        }
                        scrollToBottom();
                    }
                } catch (_) {
                }
            });

            es.addEventListener('final', (e) => {
                // 重新获取 botMsgEl（关键修复：不依赖闭包）
                const currentBotMsg = document.getElementById(botMsgId);
                if (!currentBotMsg) {
                    console.warn('final: botMsgEl not found');
                    es.close();
                    sendBtn.disabled = false;
                    return;
                }

                const typing = currentBotMsg.querySelector('.typing');
                if (typing) typing.remove();

                // 更新进度
                const details = currentBotMsg.querySelector('details.progress');
                if (details) {
                    const ul = details.querySelector('ul');
                    if (ul) {
                        const lis = ul.querySelectorAll('li');
                        lis.forEach(li => {
                            if (li.textContent.includes('⏳')) {
                                li.textContent = li.textContent.replace('⏳', '✅');
                            }
                        });
                    }
                    const summary = details.querySelector('summary');
                    if (summary) {
                        const totalDone = details.querySelectorAll('li').length;
                        summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
                    }
                    details.removeAttribute('open');
                }

                // 渲染最终答案
                try {
                    const d = JSON.parse(e.data || '{}');
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0)
                        ? d.answer
                        : (rawAnswerText || '（未返回答案）');

                    const currentAnswerEl = currentBotMsg.querySelector('.answer');
                    if (currentAnswerEl) {
                        renderAnswerWithImages(currentAnswerEl, finalText, d.image_urls || []);
                    }
                } catch (parseError) {
                    console.error('final 事件解析失败:', parseError);
                    const currentAnswerEl = currentBotMsg.querySelector('.answer');
                    if (currentAnswerEl) {
                        renderAnswerWithImages(currentAnswerEl, rawAnswerText || '（解析失败）', []);
                    }
                }

                es.close();
                sendBtn.disabled = false;
                scrollToBottom();
            });

            es.addEventListener('error', (e) => {
                const currentBotMsg = document.getElementById(botMsgId);
                if (currentBotMsg) {
                    const typing = currentBotMsg.querySelector('.typing');
                    if (typing) typing.remove();
                    const progress = currentBotMsg.querySelector('details.progress');
                    if (progress) progress.removeAttribute('open');

                    const currentAnswerEl = currentBotMsg.querySelector('.answer');
                    if (currentAnswerEl) {
                        const errorMsg = rawAnswerText
                            ? rawAnswerText + '\n\n（连接中断，已显示部分内容）'
                            : '（SSE 连接中断，请重试）';
                        renderAnswerWithImages(currentAnswerEl, errorMsg, []);
                    }
                }
                es.close();
                sendBtn.disabled = false;
                scrollToBottom();
            });

        } catch (e) {
            const bubble = botMsgEl.querySelector('.bubble');
            const progress = botMsgEl.querySelector('details.progress');
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + (progress ? progress.outerHTML : '');
            sendBtn.disabled = false;
        }
    }

    // ============================================================
    // 事件绑定
    // ============================================================
    sendBtn.addEventListener('click', onSend);
    document.querySelectorAll('#quick button').forEach(btn => {
        btn.addEventListener('click', () => {
            const q = btn.dataset.q || btn.textContent || '';
            if (!q.trim() || sendBtn.disabled) return;
            inputEl.value = q;
            onSend();
        });
    });
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            onSend();
        }
    });

    btnClear.addEventListener('click', async () => {
        if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`, {method: 'DELETE'});
            if (!res.ok) {
                console.error("Failed to clear history backend, status:", res.status);
                alert('服务端清空失败，仅清空本地显示');
            }
        } catch (e) {
            console.error("Failed to clear history backend", e);
            alert('服务端清空失败，仅清空本地显示');
        }
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        scrollToBottom();
    });

    // ============================================================
    // 初始化
    // ============================================================
    apiHealth();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>
</body>
</html>
